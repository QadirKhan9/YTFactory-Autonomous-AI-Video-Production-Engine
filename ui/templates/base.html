<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}YTFactory{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root {
      --bg: #080b10;
      --surface: #0e1218;
      --panel: #131820;
      --panel2: #181f2a;
      --line: #1e2733;
      --line2: #243044;
      --fg: #e2eaf4;
      --fg2: #a8b8cc;
      --muted: #5a7090;
      --ok: #22c55e;
      --ok-dim: #14532d;
      --bad: #ef4444;
      --bad-dim: #450a0a;
      --warn: #f59e0b;
      --warn-dim: #451a03;
      --accent: #3b82f6;
      --accent2: #6366f1;
      --glow: rgba(59,130,246,0.15);
      --grad: linear-gradient(135deg, #3b82f6 0%, #6366f1 100%);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 0 28px;
      height: 56px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(10px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
      font-weight: 700;
      color: var(--fg);
      text-decoration: none;
      letter-spacing: -0.3px;
      margin-right: 32px;
    }
    .brand-icon {
      width: 30px; height: 30px;
      background: var(--grad);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .topnav { display: flex; align-items: center; gap: 4px; flex: 1; }
    .topnav a {
      color: var(--fg2);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      transition: all .15s;
    }
    .topnav a:hover { background: var(--panel2); color: var(--fg); }
    .topnav a.active { background: var(--panel2); color: var(--accent); }
    .topnav-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

    /* ── Main layout ── */
    .page { max-width: 1180px; margin: 0 auto; padding: 32px 28px; width: 100%; }

    /* ── Typography ── */
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; margin: 0 0 6px; color: var(--fg); }
    h2 { font-size: 15px; font-weight: 600; color: var(--fg2); margin: 28px 0 12px; text-transform: uppercase; letter-spacing: 0.6px; }
    h3 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
    p { margin: 0 0 12px; color: var(--fg2); }
    code { font-family: 'JetBrains Mono', monospace; font-size: 12px;
           background: var(--panel2); padding: 2px 6px; border-radius: 4px; color: var(--accent); }
    pre {
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 14px 16px; overflow-x: auto;
      color: var(--fg2); white-space: pre-wrap; margin: 0;
    }
    textarea {
      font-family: 'JetBrains Mono', monospace; font-size: 12px;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 14px 16px; color: var(--fg2);
      width: 100%; resize: vertical;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Cards ── */
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px 22px;
      margin: 0 0 14px;
    }
    .card.glow { border-color: rgba(59,130,246,0.4); box-shadow: 0 0 0 1px rgba(59,130,246,0.1), 0 8px 32px rgba(59,130,246,0.08); }
    .card.warn-card { border-color: rgba(245,158,11,0.4); background: rgba(245,158,11,0.04); }
    .card.ok-card { border-color: rgba(34,197,94,0.4); background: rgba(34,197,94,0.04); }
    .card.bad-card { border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.04); }

    /* ── Badges ── */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.3px;
      border: 1px solid transparent;
    }
    .pass, .st-done, .st-DELIVERED, .st-APPROVED { background: rgba(34,197,94,0.12); color: var(--ok); border-color: rgba(34,197,94,0.25); }
    .fail, .st-failed, .st-FAILED, .st-REJECTED { background: rgba(239,68,68,0.12); color: var(--bad); border-color: rgba(239,68,68,0.25); }
    .warn, .skip, .st-blocked, .st-running, .st-RUNNING, .st-AWAITING_HUMAN, .st-BLOCKED_QC, .st-PAUSED {
      background: rgba(245,158,11,0.12); color: var(--warn); border-color: rgba(245,158,11,0.25);
    }
    .st-cached, .muted-badge { background: rgba(90,112,144,0.12); color: var(--muted); border-color: rgba(90,112,144,0.2); }
    .accent-badge { background: rgba(59,130,246,0.12); color: var(--accent); border-color: rgba(59,130,246,0.25); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 18px; border-radius: 10px; font-size: 13px;
      font-weight: 600; cursor: pointer; border: 1px solid transparent;
      text-decoration: none; transition: all .15s;
    }
    .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 4px 16px rgba(59,130,246,0.25); }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); text-decoration: none; }
    .btn-ok { background: rgba(34,197,94,0.15); color: var(--ok); border-color: rgba(34,197,94,0.3); }
    .btn-ok:hover { background: rgba(34,197,94,0.25); text-decoration: none; }
    .btn-danger { background: rgba(239,68,68,0.15); color: var(--bad); border-color: rgba(239,68,68,0.3); }
    .btn-danger:hover { background: rgba(239,68,68,0.25); text-decoration: none; }
    .btn-ghost { background: var(--panel2); color: var(--fg2); border-color: var(--line2); }
    .btn-ghost:hover { background: var(--line2); color: var(--fg); text-decoration: none; }

    /* ── Tables ── */
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left; padding: 10px 14px;
      font-size: 11px; font-weight: 600; letter-spacing: 0.6px;
      color: var(--muted); text-transform: uppercase;
      border-bottom: 1px solid var(--line);
    }
    td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    tr:last-child td { border-bottom: 0; }
    tr:hover td { background: rgba(255,255,255,0.015); }
    .table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }

    /* ── Form inputs ── */
    input[type="text"], input[type="search"], select {
      background: var(--panel2); border: 1px solid var(--line2);
      color: var(--fg); border-radius: 10px; padding: 10px 14px;
      font-size: 13px; font-family: inherit; outline: none;
      transition: border-color .15s;
    }
    input[type="text"]:focus, input[type="search"]:focus, select:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
    }

    /* ── Layout helpers ── */
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .muted { color: var(--muted); font-size: 13px; }
    .small { font-size: 12px; }
    .pill { display: inline-block; font-size: 12px; color: var(--muted); }
    .mt8 { margin-top: 8px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; }
    .mb0 { margin-bottom: 0; }
    .sep { height: 1px; background: var(--line); margin: 20px 0; }

    /* ── Page header ── */
    .page-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 28px; gap: 16px; }
    .page-header .actions { display: flex; gap: 8px; flex-shrink: 0; margin-top: 2px; }
    .page-title-sub { font-size: 13px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 2px; }

    /* ── Stat tiles ── */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px,1fr)); gap: 12px; margin-bottom: 24px; }
    .stat-tile {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 16px 18px;
    }
    .stat-tile .val { font-size: 28px; font-weight: 700; line-height: 1; }
    .stat-tile .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Scene grid ── */
    .scene-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 10px; }
    .scene-card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; overflow: hidden; transition: border-color .15s, transform .15s;
    }
    .scene-card:hover { border-color: var(--line2); transform: translateY(-2px); }
    .scene-card img, .scene-card .scene-blank {
      width: 100%; height: 110px; object-fit: cover; display: block; background: var(--panel2);
    }
    .scene-card .scene-blank { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 22px; }
    .scene-body { padding: 10px 12px; }
    .scene-num { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .scene-time { font-size: 11px; color: var(--muted); }

    /* ── Step timeline ── */
    .step-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 8px; }
    .step-item {
      display: flex; align-items: center; gap: 10px;
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 10px 14px;
    }
    .step-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .step-dot.done { background: var(--ok); box-shadow: 0 0 8px rgba(34,197,94,0.4); }
    .step-dot.blocked, .step-dot.running { background: var(--warn); box-shadow: 0 0 8px rgba(245,158,11,0.4); animation: pulse 1.5s ease infinite; }
    .step-dot.failed { background: var(--bad); box-shadow: 0 0 8px rgba(239,68,68,0.4); }
    .step-dot.cached { background: var(--muted); }
    .step-dot.pending { background: var(--line2); }
    .step-name { font-size: 12px; font-weight: 600; font-family: 'JetBrains Mono', monospace; flex: 1; }
    .step-status { font-size: 11px; color: var(--muted); }

    /* ── Video player ── */
    video { width: 100%; max-height: 460px; background: #000; border-radius: 14px; display: block; }

    /* ── Error alert ── */
    .alert { padding: 12px 16px; border-radius: 10px; margin-bottom: 16px; font-size: 13px; }
    .alert-error { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; }
    .alert-warn { background: rgba(245,158,11,0.1); border: 1px solid rgba(245,158,11,0.3); color: #fcd34d; }
    .alert-ok { background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.3); color: #86efac; }

    /* ── Gate banner ── */
    .gate-banner {
      background: linear-gradient(135deg, rgba(245,158,11,0.08) 0%, rgba(245,158,11,0.03) 100%);
      border: 1px solid rgba(245,158,11,0.35);
      border-radius: 14px; padding: 20px 24px; margin-bottom: 24px;
    }
    .gate-banner h3 { color: var(--warn); font-size: 16px; margin-bottom: 6px; }
    .gate-banner p { color: var(--fg2); margin-bottom: 14px; font-size: 13px; }
    .gate-banner .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ── QC bar ── */
    .qc-bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; margin: 8px 0 4px; }
    .qc-bar-inner { height: 100%; border-radius: 999px; background: var(--grad); transition: width .5s; }

    /* ── Run modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.75); z-index: 200;
      align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--panel); border: 1px solid var(--line2);
      border-radius: 18px; padding: 28px 30px;
      width: 100%; max-width: 520px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
      animation: slideUp .2s ease;
    }
    .modal h3 { font-size: 18px; margin-bottom: 6px; }
    .modal p { color: var(--fg2); font-size: 13px; margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-group input[type="text"],
    .form-group select { width: 100%; }
    .form-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

    /* ── Event log ── */
    .event-log { display: flex; flex-direction: column; gap: 6px; }
    .event-item { display: flex; gap: 10px; align-items: flex-start; font-size: 12px; }
    .event-dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
    .event-dot.info { background: var(--accent); }
    .event-dot.warning { background: var(--warn); }
    .event-dot.error { background: var(--bad); }
    .event-time { color: var(--muted); flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; margin-top: 2px; }
    .event-msg { color: var(--fg2); }

    /* ── Animations ── */
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .fadein { animation: fadeIn .3s ease; }
  </style>
</head>
<body>
<nav class="topbar">
  <a class="brand" href="/">
    <div class="brand-icon">▶</div>
    YTFactory
  </a>
  <div class="topnav">
    <a href="/" id="nav-dashboard">Dashboard</a>
    {% block nav %}{% endblock %}
  </div>
  <div class="topnav-right">
    <button class="btn btn-primary" onclick="document.getElementById('run-modal').classList.add('open')" id="new-project-btn">
      ＋ New Project
    </button>
  </div>
</nav>

<div class="page fadein">
  {% if error %}<div class="alert alert-error">⚠ {{ error }}</div>{% endif %}
  {% block content %}{% endblock %}
</div>

<!-- Run new project modal -->
<div class="modal-overlay" id="run-modal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal">
    <h3>🚀 Start New Project</h3>
    <p>Enter a topic and the pipeline will run from S00 through S22, pausing at the human gate.</p>
    <form action="/run" method="post">
      <div class="form-group">
        <label>Topic / Question</label>
        <input type="text" name="topic" id="run-topic" placeholder="e.g. How does SpaceX land rockets?" required style="width:100%">
      </div>
      <div class="form-group">
        <label>Mode</label>
        <select name="mode" id="run-mode" style="width:100%">
          <option value="live">Live (real API calls)</option>
          <option value="dry">Dry run (no API calls)</option>
        </select>
      </div>
      <div class="form-row">
        <button type="button" class="btn btn-ghost" onclick="document.getElementById('run-modal').classList.remove('open')">Cancel</button>
        <button type="submit" class="btn btn-primary">Run Pipeline</button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
